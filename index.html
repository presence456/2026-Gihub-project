<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="簡單、離線可用的待辦清單，幫你記下每一件重要的小事。"
    />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="todo-app">
      <header class="app-header">
        <p class="eyebrow">把每件事，一步一步完成</p>
        <h1>待辦清單</h1>
        <p class="subtitle">記下今天想完成的事，從一件開始就好。</p>
      </header>

      <section class="todo-card" aria-label="待辦事項">
        <form class="todo-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="例如：完成今天的閱讀"
            autocomplete="off"
            maxlength="200"
          />
          <button class="add-button" type="submit">新增</button>
        </form>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <p class="empty-message" id="empty-message">
          還沒有任何待辦事項,新增一個吧!
        </p>

        <footer class="list-footer">
          <span id="remaining-count" aria-live="polite">未完成:0 項</span>
        </footer>
      </section>

      <p class="app-note">你的清單只會儲存在這個瀏覽器中。</p>
    </main>
  </body>
</html>
